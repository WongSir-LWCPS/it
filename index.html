<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT一站式平台｜樂華天主教小學</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261008c">
  <script>
    // 程式載入或執行失敗時，在頁面上顯示原因（而不是空白頁）
    (function () {
      function show(msg) {
        var el = document.getElementById("loading") || document.getElementById("load-fail");
        if (!el) {
          el = document.createElement("div");
          el.id = "load-fail";
          el.className = "loading";
          document.body.insertBefore(el, document.body.firstChild.nextSibling);
        }
        el.innerHTML = "系統未能載入：" + String(msg).replace(/</g, "&lt;") +
          "<br>請按 Ctrl + Shift + R（Mac：Cmd + Shift + R）重新整理。如仍未能解決，請把這段文字截圖告訴IT組。";
      }
      window.__showLoadError = show;
      // 程式檔下載失敗（例如 404）
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t !== window) {            // 資源載入失敗：只理會程式檔（字型、圖片失敗不影響使用）
          if (t.tagName === "SCRIPT") show("未能下載程式檔 " + (t.src || ""));
          return;
        }
        show(e.message || "程式錯誤");
      }, true);
      window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || "程式錯誤"); });
      // 15 秒後仍未顯示任何內容
      setTimeout(function () {
        var main = document.getElementById("main"), gate = document.getElementById("gate");
        if (document.getElementById("loading") || (main && main.hidden && gate && gate.hidden)) show("載入時間過長，請檢查網絡連線");
      }, 15000);
    })();
  </script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <p id="loading" class="loading">載入中…</p>
  <div id="gate" class="gate" hidden></div>

  <main id="main" class="wrap" hidden>
    <section class="home-intro">
      <h1>IT組校內系統</h1>
      <p>選擇要使用的系統。IT組加入新系統後，會在下面的清單出現。</p>
    </section>
    <ul id="systems" class="systems"></ul>
    <p id="settings-link" class="mt" hidden><a class="btn" href="settings.html">⚙️ 平台設定（管理員名單）</a></p>
  </main>

  <script type="module">
    import { boot, esc, visibleSystems } from "./assets/js/common.js?v=20261008c";
    import { SYSTEMS } from "./assets/js/systems.js?v=20261008c";

    boot({
      root: "./", current: "home",
      onReady: ({ isAdmin, hiddenSystems }) => {
        document.getElementById("settings-link").hidden = !isAdmin;
        document.getElementById("systems").innerHTML = visibleSystems(hiddenSystems, isAdmin).map((s) => `
          <li class="system${hiddenSystems.includes(s.id) ? " is-hidden" : ""}">
            <span class="system-icon" aria-hidden="true">${s.icon || "🧩"}</span>
            <div class="system-body">
              <h2><a href="${s.href}">${esc(s.name)}</a>${hiddenSystems.includes(s.id) ? ' <span class="badge badge--muted">已隱藏</span>' : ""}</h2>
              <p>${esc(s.desc)}</p>
            </div>
            <div class="system-actions">
              <a class="btn btn--primary" href="${s.href}">開啟</a>
              ${isAdmin && s.adminHref ? `<a class="btn" href="${s.adminHref}">管理及審批</a>` : ""}
            </div>
          </li>`).join("");
      },
    });
  </script>
</body>
</html>
