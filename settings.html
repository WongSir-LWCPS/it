<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平台設定｜IT一站式平台</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261005k">
  <script>
    // 程式載入失敗時顯示原因，而不是一直停在「載入中」
    (function () {
      function show(msg) {
        var el = document.getElementById("loading");
        if (el) el.innerHTML = "系統未能載入：" + msg + "<br>請按 Ctrl + Shift + R（Mac：Cmd + Shift + R）重新整理。如仍未能解決，請把這段文字告訴IT組。";
      }
      window.addEventListener("error", function (e) { show(e.message || "程式錯誤"); });
      window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || "程式錯誤"); });
      setTimeout(function () { if (document.getElementById("loading")) show("載入時間過長，請檢查網絡連線"); }, 15000);
    })();
  </script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <p id="loading" class="loading">載入中…</p>
  <div id="gate" class="gate" hidden></div>

  <main id="main" class="wrap" hidden>
    <nav class="crumbs" aria-label="位置">
      <a href="index.html">IT一站式平台</a>
      <span aria-hidden="true">/</span>
      <span>平台設定</span>
    </nav>
    <h1>平台設定</h1>

    <section id="admin-section" class="block" hidden>
      <h2>管理員</h2>
      <p class="hint">管理員可以審批所有系統的申請、管理播放日期、匯入資料，以及在這裏新增或移除管理員。只可加入學校教職員帳戶。</p>

      <form id="add-admin" class="card-form compact-forms">
        <div class="inline-form">
          <label class="field field--compact field--grow"><span>管理員電郵</span>
            <input type="email" name="email" required placeholder="例如 chantm@lwcps.edu.hk" autocomplete="off">
          </label>
          <label class="field field--compact"><span>名稱（選填）</span>
            <input name="name" maxlength="40" placeholder="例如 陳老師">
          </label>
          <button class="btn btn--primary btn--small" type="submit">加入管理員</button>
        </div>
        <p class="warn" id="add-warn" role="alert" hidden></p>
      </form>

      <div id="admin-list" class="mt-s"></div>
    </section>
  </main>

  <script type="module" src="assets/js/settings.js?v=20261005k"></script>
</body>
</html>
