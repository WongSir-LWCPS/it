<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copilot借用申請｜IT一站式平台</title>
  <link rel="icon" href="../../assets/img/favicon.png">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261008a">
  <script>
    // 程式載入失敗時顯示原因，而不是一直停在「載入中」
    (function () {
      function show(msg) {
        var el = document.getElementById("loading");
        if (el) el.innerHTML = "系統未能載入：" + msg + "<br>請按 Ctrl + Shift + R（Mac：Cmd + Shift + R）重新整理。如仍未能解決，請把這段文字告訴IT組。";
      }
      window.addEventListener("error", function (e) { show(e.message || "程式錯誤"); });
      window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || "程式錯誤"); });
      setTimeout(function () { if (document.getElementById("loading")) show("載入時間過長，請檢查網絡連線"); }, 15000);
    })();
  </script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <p id="loading" class="loading">載入中…</p>
  <div id="gate" class="gate" hidden></div>

  <main id="main" class="wrap wrap--narrow" hidden>
    <nav class="crumbs" aria-label="位置">
      <a href="../../index.html">IT一站式平台</a>
      <span aria-hidden="true">/</span>
      <span>Copilot借用申請</span>
      <a id="admin-link" class="btn btn--small crumbs-action" href="admin.html" hidden>管理及審批</a>
    </nav>

    <h1>Copilot借用申請</h1>
    <p class="hint" id="intro"></p>

    <form id="req-form" class="card-form" novalidate>
      <fieldset class="field">
        <legend>您的姓名/代號</legend>
        <div class="name-choices">
          <label class="check"><input type="radio" name="nameMode" value="login" checked> <span id="login-name"></span></label>
          <label class="check"><input type="radio" name="nameMode" value="other"> 其他（自行輸入）</label>
        </div>
      </fieldset>
      <div class="field-row" id="other-wrap" hidden>
        <label class="field"><span>姓名/代號</span><input name="otherName" maxlength="40" placeholder="請輸入姓名或代號"></label>
        <label class="field"><span>申請人電郵</span><input type="email" name="otherEmail" maxlength="80" placeholder="例如 chantm@lwcps.edu.hk" autocomplete="off"></label>
      </div>

      <label class="field">
        <span>所屬組別/科組</span>
        <select name="group" required></select>
      </label>
      <label class="field" id="other-group-wrap" hidden>
        <span>其他組別/科組</span>
        <input name="otherGroup" maxlength="40" placeholder="請輸入組別或科組">
      </label>

      <div class="field-row">
        <label class="field field--date"><span>開始借用日期</span><input type="date" name="startDate" required></label>
        <label class="field field--date"><span>預計結束借用日期</span><input type="date" name="endDate" required></label>
      </div>
      <p class="hint" id="days-info"></p>

      <fieldset class="field">
        <legend>用途（可選多項）</legend>
        <div class="choices" id="purpose-choices"></div>
      </fieldset>
      <label class="field" id="other-purpose-wrap" hidden>
        <span>其他用途</span>
        <input name="otherPurpose" maxlength="100" placeholder="請說明用途">
      </label>

      <p class="notice-box" id="notice"></p>
      <p class="warn" id="req-warn" role="alert" hidden></p>
      <p class="sheet-foot">Copilot 會授權給申請人的學校電郵。提交後，IT組會收到通知；審批結果可在「我的申請」查看。</p>
      <div class="actions actions--start">
        <button type="submit" class="btn btn--primary" id="req-submit">提交申請</button>
      </div>
    </form>

    <section class="block mt">
      <h2>我的申請</h2>
      <div id="mine"></div>
    </section>
  </main>

  <script type="module" src="copilot.js?v=20261008a"></script>
</body>
</html>
