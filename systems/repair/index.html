<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>電子器材損壞報告｜IT一站式平台</title>
  <link rel="icon" href="../../assets/img/favicon.png">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261017d">
  <script>
    // 程式載入或執行失敗時，在頁面上顯示原因（而不是空白頁）
    (function () {
      function show(msg) {
        var el = document.getElementById("loading") || document.getElementById("load-fail");
        if (!el) {
          el = document.createElement("div");
          el.id = "load-fail";
          el.className = "loading";
          document.body.insertBefore(el, document.body.firstChild.nextSibling);
        }
        el.innerHTML = "系統未能載入：" + String(msg).replace(/</g, "&lt;") +
          "<br>請按 Ctrl + Shift + R（Mac：Cmd + Shift + R）重新整理。如仍未能解決，請把這段文字截圖告訴IT組。";
      }
      window.__showLoadError = show;
      // 程式檔下載失敗（例如 404）
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t !== window) {            // 資源載入失敗：只理會程式檔（字型、圖片失敗不影響使用）
          if (t.tagName === "SCRIPT") show("未能下載程式檔 " + (t.src || ""));
          return;
        }
        show(e.message || "程式錯誤");
      }, true);
      window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || "程式錯誤"); });
      // 15 秒後仍未顯示任何內容
      setTimeout(function () {
        var main = document.getElementById("main"), gate = document.getElementById("gate");
        if (document.getElementById("loading") || (main && main.hidden && gate && gate.hidden)) show("載入時間過長，請檢查網絡連線");
      }, 15000);
    })();
  </script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <p id="loading" class="loading">載入中…</p>
  <div id="gate" class="gate" hidden></div>

  <main id="main" class="wrap wrap--narrow" hidden>
    <nav class="crumbs" aria-label="位置">
      <a href="../../index.html">IT一站式平台</a>
      <span aria-hidden="true">/</span>
      <span>電子器材損壞報告</span>
      <a id="admin-link" class="btn btn--small crumbs-action" href="admin.html" hidden>管理及跟進</a>
    </nav>

    <h1>電子器材損壞報告</h1>
    <p class="hint">發現電子器材損壞時，請填寫下表。提交後IT組會收到電郵通知，跟進情況可在下方「我的報告」查看。</p>

    <form id="rep-form" class="card-form repair-form" novalidate>
      <dl class="kv kv--wide repair-auto">
        <dt>報告老師</dt><dd id="rep-name" data-no-translate></dd>
        <dt>報告日期</dt><dd id="rep-date"></dd>
      </dl>
      <label class="field"><span>地點</span>
        <select name="location"><option value="">請選擇地點</option></select>
      </label>
      <label class="field" id="loc-other-wrap" hidden><span>其他地點</span>
        <input name="locationOther" maxlength="60" placeholder="請輸入地點" autocomplete="off">
      </label>
      <label class="field"><span>損壞的器材</span>
        <input name="device" maxlength="80" placeholder="例如：投影機、電腦、喇叭、實物投影機" list="dev-list" autocomplete="off">
        <datalist id="dev-list"></datalist>
      </label>
      <label class="field"><span>損壞情況</span>
        <textarea name="problem" rows="4" maxlength="1000" placeholder="例如：投影機開機後沒有畫面，指示燈閃紅色"></textarea>
      </label>

      <p class="warn" id="rep-warn" role="alert" hidden></p>
      <div class="actions actions--start">
        <button type="submit" class="btn btn--primary" id="rep-submit">提交報告</button>
      </div>
    </form>

    <section class="block mt">
      <h2>我的報告</h2>
      <div id="mine"></div>
    </section>
  </main>

  <script type="module" src="repair.js?v=20261017d"></script>
</body>
</html>
