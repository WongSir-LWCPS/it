<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>增加彩色列印限額申請｜IT一站式平台</title>
  <link rel="icon" href="../../assets/img/favicon.png">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261008c">
  <script>
    // 程式載入或執行失敗時，在頁面上顯示原因（而不是空白頁）
    (function () {
      function show(msg) {
        var el = document.getElementById("loading") || document.getElementById("load-fail");
        if (!el) {
          el = document.createElement("div");
          el.id = "load-fail";
          el.className = "loading";
          document.body.insertBefore(el, document.body.firstChild.nextSibling);
        }
        el.innerHTML = "系統未能載入：" + String(msg).replace(/</g, "&lt;") +
          "<br>請按 Ctrl + Shift + R（Mac：Cmd + Shift + R）重新整理。如仍未能解決，請把這段文字截圖告訴IT組。";
      }
      window.__showLoadError = show;
      // 程式檔下載失敗（例如 404）
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t !== window) {            // 資源載入失敗：只理會程式檔（字型、圖片失敗不影響使用）
          if (t.tagName === "SCRIPT") show("未能下載程式檔 " + (t.src || ""));
          return;
        }
        show(e.message || "程式錯誤");
      }, true);
      window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || "程式錯誤"); });
      // 15 秒後仍未顯示任何內容
      setTimeout(function () {
        var main = document.getElementById("main"), gate = document.getElementById("gate");
        if (document.getElementById("loading") || (main && main.hidden && gate && gate.hidden)) show("載入時間過長，請檢查網絡連線");
      }, 15000);
    })();
  </script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <p id="loading" class="loading">載入中…</p>
  <div id="gate" class="gate" hidden></div>

  <main id="main" class="wrap wrap--narrow" hidden>
    <nav class="crumbs" aria-label="位置">
      <a href="../../index.html">IT一站式平台</a>
      <span aria-hidden="true">/</span>
      <span>增加彩色列印限額申請</span>
      <a id="admin-link" class="btn btn--small crumbs-action" href="admin.html" hidden>管理及審批</a>
    </nav>

    <h1>增加彩色列印限額申請</h1>
    <p class="hint" id="intro"></p>

    <form id="req-form" class="card-form" novalidate>
      <fieldset class="field">
        <legend>申請人名稱</legend>
        <div class="name-choices">
          <label class="check"><input type="radio" name="nameMode" value="login" checked> <span id="login-name"></span></label>
          <label class="check"><input type="radio" name="nameMode" value="other"> 其他（自行輸入）</label>
        </div>
      </fieldset>
      <div class="field-row" id="other-wrap" hidden>
        <label class="field"><span>申請人名稱</span><input name="otherName" maxlength="40" placeholder="請輸入申請人名稱"></label>
        <label class="field"><span>申請人電郵</span><input type="email" name="otherEmail" maxlength="80" placeholder="例如 chantm@lwcps.edu.hk" autocomplete="off"></label>
      </div>

      <label class="field">
        <span>備註（選填）</span>
        <textarea name="remarks" rows="2" maxlength="300" placeholder="例如：需要列印全年級彩色工作紙"></textarea>
      </label>

      <p class="warn" id="req-warn" role="alert" hidden></p>
      <p class="sheet-foot">申請日期為提交當日。提交後，IT組會收到通知；處理進度可在「我的申請」查看。</p>
      <div class="actions actions--start">
        <button type="submit" class="btn btn--primary" id="req-submit">提交申請</button>
      </div>
    </form>

    <section class="block mt">
      <h2>我的申請</h2>
      <div id="mine"></div>
    </section>
  </main>

  <script type="module" src="print.js?v=20261008c"></script>
</body>
</html>
