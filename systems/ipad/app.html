<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>iPad借用記錄表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=20261006j">
</head>
<body>
<!-- 這一頁在 IT一站式平台的 iPad 頁面（index.html）內以 iframe 顯示，登入及資料讀寫由平台提供 -->
<div id="app"><div class="boot">載入中…</div></div>
<script src="app.js?v=20261006j"></script>
<script>
  (function () {
    var env = null;
    try { env = window.parent !== window ? window.parent.IPAD_ENV : null; } catch (e) { env = null; }
    if (!env) {
      document.getElementById("app").innerHTML =
        '<div class="boot">請由 IT一站式平台開啟 iPad借用記錄表。</div>';
      return;
    }
    appMain(env);
  })();
</script>
</body>
</html>
